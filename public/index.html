<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>留学顾问助手 Demo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <section id="login-page" class="login-page">
      <form id="login-form" class="login-card">
        <div class="header">
          <p class="eyebrow">Welcome</p>
          <h1>留学顾问助手</h1>
          <p>AI 辅助咨询分析与跟进管理工具</p>
        </div>

        <label>
          用户名
          <input name="username" autocomplete="username" placeholder="请输入用户名" />
        </label>

        <label>
          密码
          <input name="password" type="password" autocomplete="current-password" placeholder="请输入密码" />
        </label>

        <fieldset class="role-field">
          <legend>身份选择</legend>
          <label class="role-option">
            <input type="radio" name="role" value="consultant" checked />
            <span>顾问</span>
          </label>
          <label class="role-option">
            <input type="radio" name="role" value="supervisor" />
            <span>顾问主管</span>
          </label>
        </fieldset>

        <p id="login-error" class="login-error hidden">请输入用户名和密码。</p>
        <button type="submit">登录</button>
      </form>
    </section>

    <main id="app-page" class="app hidden">
      <header class="app-header">
        <div>
          <p class="eyebrow">Signed in</p>
          <p id="current-user" class="current-user">当前用户：-｜身份：-</p>
        </div>
        <button id="logout-button" type="button" class="logout-button">退出登录</button>
      </header>

      <section class="panel form-panel">
        <div class="header">
          <p class="eyebrow">MVP Demo</p>
          <h1>留学顾问助手</h1>
          <p>录入学生基础信息，调用 DeepSeek 生成缺失信息、风险点、建议方向和咨询纪要。</p>
        </div>

        <form id="student-form" class="form">
          <label>
            学生姓名
            <input name="studentName" value="王同学" />
          </label>

          <div class="grid">
            <label>
              当前年级
              <input name="grade" value="高二" />
            </label>
            <label>
              申请目标
              <input name="applicationGoal" value="美国本科" />
            </label>
          </div>

          <label>
            目标与诉求
            <textarea name="goals">希望申请美国 Top 50 综合大学，偏商科或经济方向。家长希望尽量冲刺名校。</textarea>
          </label>

          <label>
            成绩与标化
            <textarea name="academics">校内均分 88，托福 92，SAT 尚未出分。</textarea>
          </label>

          <label>
            活动/科研/竞赛
            <textarea name="activities">校内社团、志愿服务，活动经历较分散，缺少专业主线。</textarea>
          </label>

          <label>
            家庭预算与限制
            <textarea name="budget">预算未明确，地区偏好未确认。</textarea>
          </label>

          <label>
            顾问备注
            <textarea name="consultantNotes">学生表达能力不错，但缺少可验证成果。家庭对选校层级存在分歧。</textarea>
          </label>

          <button id="submit-button" type="submit">开始 AI 初筛</button>
        </form>
      </section>

      <section class="panel result-panel">
        <div class="result-header">
          <div>
            <p class="eyebrow">AI Analysis</p>
            <h2>分析结果</h2>
          </div>
          <span id="status" class="status">待分析</span>
        </div>

        <div id="empty-state" class="empty-state">
          点击左侧按钮后，这里会显示 DeepSeek 返回的真实分析结果。
        </div>

        <div id="result" class="result hidden">
          <article>
            <h3>缺失信息</h3>
            <ul id="missing-info"></ul>
          </article>

          <article>
            <h3>风险点</h3>
            <div id="risk-points" class="risk-list"></div>
          </article>

          <article>
            <h3>初步建议方向</h3>
            <ul id="recommendations"></ul>
          </article>

          <article>
            <h3>咨询纪要</h3>
            <p id="memo" class="memo"></p>
          </article>

          <article>
            <h3>下一步跟进建议</h3>
            <ul id="next-steps"></ul>
          </article>
        </div>
      </section>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
